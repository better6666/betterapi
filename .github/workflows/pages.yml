name: GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "admin-console/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin-console/package-lock.json

      - name: Install dependencies
        working-directory: admin-console
        run: npm ci --no-audit --no-fund

      - name: Build static console
        working-directory: admin-console
        env:
          VITE_BASE_PATH: /betterapi/
          VITE_PAGES_REDIRECT_ORIGIN: https://betterapi-control-plane.2333333434.workers.dev
        run: |
          npm run build
          cp dist/index.html dist/404.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: admin-console/dist

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
