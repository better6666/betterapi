    <circle cx="110" cy="545" r="22" fill="#23a36d"/><text x="110" y="553" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="700">1</text>
    <text x="155" y="553" fill="#273746" font-size="22" font-weight="700">Cloudflare 原生</text><text x="350" y="553" fill="#667581" font-size="20">Workers、D1、R2、KV、Durable Objects、Queues、Analytics Engine</text>
